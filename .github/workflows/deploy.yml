name: Deploy to GitHub Pages

on:
  # Manual only for now (Actions tab → "Deploy to GitHub Pages" → Run workflow).
  # Uncomment the triggers below to re-enable automatic deploys.
  # push:
  #   branches: [main]
  # # Fired by the apbase-docs workflow after the docs change.
  # repository_dispatch:
  #   types: [docs-updated]
  # # Safety net in case a dispatch is missed.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # API reference: Sphinx autodoc over the apbase package, published at /api/.
      - uses: actions/checkout@v4
        with:
          repository: ap-base/apbase-docs
          path: apbase-docs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apbase-docs/requirements-docs.txt

      - run: |
          pip install -r apbase-docs/requirements-docs.txt
          pip install "git+https://github.com/ap-base/apbase-python.git"

      - run: scripts/build-api-reference.sh apbase-docs out/api

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
